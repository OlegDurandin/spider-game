[package]
name = "spider-web"
version = "0.1.0"
edition = "2024"

[dependencies]
spider-engine = { path = "../engine" }
leptos = { version = "0.8", features = ["csr"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Event", "EventTarget", "Location", "Element", "Node", "NodeList", "DomRect", "DomTokenList", "MediaQueryList", "PointerEvent", "MouseEvent", "HtmlElement", "CssStyleDeclaration", "KeyboardEvent", "UrlSearchParams"] }
console_error_panic_hook = "0.1"

serde = { version = "1", features = ["derive"] }
gloo-net = "0.6"
wasm-bindgen-futures = "0.4"
