<!doctype html><meta charset="utf-8"><title>Паук · приёмка 1.1.1</title>
<style>body{margin:0;min-height:844px;background:#16271e;color:#f4e6bd;font:13px system-ui}aside{position:fixed;left:12px;top:12px;width:230px}button{margin:3px;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.4}iframe{display:block;border:0;width:390px;height:844px;margin:auto}</style>
<aside><p>Отдельные тестовые данные · 390 × 844</p><button id="setup">Три партии</button><button id="empty">Без обычной</button><button id="zero">Обычная без ходов</button><button id="won">Победа</button><br><button data-size="360,640">360 × 640</button><button data-size="390,844">390 × 844</button><button data-size="390,500">390 × 500</button><button data-size="360,320">360 × 320</button><button id="text">Текст 175%</button><br><button id="capture">Запомнить</button><button id="reload">Перезапуск</button><button id="assess">Проверить</button><pre id="report">Подготовьте тестовые партии.</pre></aside><iframe src="/?qa=compact"></iframe>
<script>
const f=document.querySelector('iframe'),r=document.querySelector('#report'),base='spider.game.v1',challenge='challenge_s1_2_0123456789abcdef',day='daily_20261115';let captured=null;
const key=s=>s==='regular'?base:base+'.'+s;
const read=s=>JSON.parse(localStorage.getItem(key(s))||'null');
const snap=()=>Object.fromEntries(['regular',day,challenge].map(s=>[s,localStorage.getItem(key(s))]));
const load=async n=>(await fetch('/fixtures/'+n+'.json')).text();
const reload=()=>f.src='/?qa=compact'+Date.now();
document.querySelector('#setup').onclick=async()=>{for(const [s,n]of [['regular','compact-ordinary'],[day,'compact-day'],[challenge,'compact-challenge']])localStorage.setItem(key(s),await load(n));localStorage.setItem(base+'.active',challenge);captured=snap();reload();r.textContent='Три партии по одному ходу. На столе вызов друга.';};
document.querySelector('#empty').onclick=()=>{localStorage.removeItem(base);localStorage.setItem(base+'.active',challenge);captured=snap();reload();};
document.querySelector('#zero').onclick=async()=>{const g=JSON.parse(await load('compact-ordinary'));g.state=g.history[0];g.history=[];localStorage.setItem(base,JSON.stringify(g));localStorage.setItem(base+'.active',challenge);captured=snap();reload();};
document.querySelector('#won').onclick=async()=>{localStorage.setItem(base,await load('published-win'));localStorage.setItem(base+'.active','regular');captured=snap();reload();};
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const[w,h]=b.dataset.size.split(',');f.style.width=w+'px';f.style.height=h+'px';document.body.style.minHeight=h+'px';document.querySelector('aside p').textContent=w+' × '+h+' CSS px';};
document.querySelector('#text').onclick=()=>f.contentDocument.documentElement.style.fontSize='28px';
document.querySelector('#capture').onclick=()=>{captured=snap();r.textContent='Запомнено';};
document.querySelector('#reload').onclick=reload;
document.querySelector('#assess').onclick=()=>{try{const d=f.contentDocument,app=d.querySelector('.game'),panels=[...d.querySelectorAll('[role=dialog]')],p=panels[0],rect=p?.getBoundingClientRect(),a=app.getBoundingClientRect(),buttons=p?[...p.querySelectorAll('button')]:[],start=buttons.find(b=>b.textContent==='Начать игру'),parties=buttons.find(b=>b.textContent.includes('Мои партии')),inside=b=>!b||b.getBoundingClientRect().bottom<=Math.min(rect.bottom,a.bottom)+.1;const now=snap(),active=localStorage.getItem(base+'.active')||'regular',g=read(active);r.textContent=JSON.stringify({viewport:[f.contentWindow.innerWidth,f.contentWindow.innerHeight],active,rawSeed:(localStorage.getItem(key(active))||'').match(/"seed":(\d+)/)?.[1],moves:g.state.moves,undo:g.history.length,mode:g.state.mode,panels:panels.length,panel:p?.getAttribute('aria-label'),panelHeight:rect?.height,internalScroll:p?p.scrollHeight>p.clientHeight:false,startVisible:inside(start),partiesVisible:inside(parties),warning:p?.textContent.includes('Предыдущая обычная партия будет заменена'),codesInLabels:p?/\b[sd]1_|\bp1_/.test([...p.querySelectorAll('h2,p')].map(x=>x.textContent).join('')):false,inert:d.querySelector('.game-surface').inert,preserved:captured?Object.fromEntries(Object.keys(now).map(s=>[s,now[s]===captured[s]])):null},null,1);}catch(e){r.textContent=e.message;}};
</script>
