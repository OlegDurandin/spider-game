<!doctype html><meta charset="utf-8"><title>Три пика · приёмка 1.3</title>
<style>body{margin:0;background:#172d22;color:#f4e6bd;font:13px system-ui}aside{position:absolute;left:420px;top:8px;width:650px}button{padding:8px;margin:4px}pre{white-space:pre-wrap}iframe{display:block;border:0;width:390px;height:844px}</style>
<aside><button id="run">Запустить приёмку</button><button id="start">Стол 390</button><button id="small">Стол 360</button><pre id="report">Готово</pre></aside><iframe title="Игровой клиент"></iframe>
<script>
const f=document.querySelector('iframe'),r=document.querySelector('#report'),base='spider.game.v1',slot='tripeaks_regular';
const key=s=>s==='regular'?base:base+'.'+s;const raw=s=>localStorage.getItem(key(s));const read=()=>JSON.parse(raw(localStorage.getItem(base+'.active')||'regular'));
const pause=()=>new Promise(r=>setTimeout(r,100));
const assert=(ok,why)=>{if(!ok)throw Error(why)};const pass=s=>r.textContent+='PASS '+s+'\n';
const doc=()=>f.contentDocument;
const button=(text,aria=false)=>[...doc().querySelectorAll('button')].find(b=>aria?b.getAttribute('aria-label')===text:b.textContent.replace(/›/g,'').trim()===text);
async function click(text,aria=false){const b=button(text,aria);assert(b,'button '+text);assert(!b.disabled,'disabled '+text);b.click();await pause();}
async function reload(query=''){f.src='/'+query;for(let i=0;i<100;i++){await pause();if(doc()?.querySelector('.game'))return;}throw Error('WASM not mounted');}
async function fixture(name){localStorage.setItem(key(slot),await(await fetch('/fixtures/'+name+'.json')).text());localStorage.setItem(base+'.active',slot);await reload();}
const semantic=g=>JSON.stringify({state:g.state,history:g.history});
async function parties(prefix){await click('Пауза',true);await click('Мои партии');const b=[...doc().querySelectorAll('.panel-rows button')].find(b=>b.textContent.startsWith(prefix));assert(b,'party '+prefix);b.click();await pause();}
function layout(width){assert(f.contentWindow.innerWidth===width,'viewport width');const d=doc();assert(d.documentElement.scrollWidth===width,'horizontal overflow');const cards=[...d.querySelectorAll('.t-table .card')].filter(c=>+c.dataset.position>=18);assert(cards.length===10,'ten bottom cards');for(const c of cards){const b=c.getBoundingClientRect();assert(b.left>=0 && b.right<=width && b.width>=32,'card bounds');assert(d.elementFromPoint(b.left+b.width/2,b.top+b.height/2)===c || c.contains(d.elementFromPoint(b.left+b.width/2,b.top+b.height/2)),'tap center exposed');}pass('layout '+width+' px, ten readable / tappable cards, no overflow');}
async function actions(){await click('Пауза',true);await click('Действия с раскладом',true);}
document.querySelector('#run').onclick=async()=>{r.textContent='';try{
 // Only this isolated localhost QA origin is used.
 for(const [s,n] of [['regular','spider'],['klondike_regular','klondike'],[slot,'ordinary']])localStorage.setItem(key(s),await(await fetch('/fixtures/'+n+'.json')).text());localStorage.setItem(base+'.active',slot);
 await reload();let expected=semantic(read());await reload();assert(semantic(read())===expected,'TriPeaks reload');pass('TriPeaks position + undo after reload');
 for(const [prefix,s] of [['Паук · Обычная партия','regular'],['Косынка · Обычная партия','klondike_regular'],['Три пика · Обычная партия',slot]]){const saved=semantic(JSON.parse(raw(s)));await parties(prefix);assert(semantic(read())===saved,prefix+' switch');await reload();assert(semantic(read())===saved,prefix+' reload');}pass('all three ordinary slots switch and survive reload');
 await click('Новая игра',true);const before=raw(slot);for(const name of ['Паук','Косынка','Три пика']){const b=[...doc().querySelectorAll('[role=radio]')].find(b=>b.textContent===name);assert(b,'radio '+name);b.click();await pause();assert(raw(slot)===before,'picker mutated table');}await click('Закрыть новую игру',true);pass('compact three-game picker changes nothing until start');
 await fixture('start');layout(390);f.style.width='360px';await pause();layout(360);f.style.width='390px';await pause();
 let g=read();expected=semantic(g);await click('Подсказка');assert(semantic(read())===expected,'hint mutated');assert(doc().querySelector('.t-hint'),'hint visible');pass('hint highlights without a move');
 const closed=doc().querySelector('.t-table .card.back');assert(closed.disabled,'closed inaccessible');const top=g.state.waste.at(-1).id%13+1;const bad=[...doc().querySelectorAll('.t-table .card:not(.back)')].find(c=>{const a=+c.dataset.cardId%13+1;return ![1,12].includes(Math.abs(a-top))});if(bad){bad.click();await pause();assert(semantic(read())===expected,'invalid tap mutated');}pass('closed and wrong-rank taps do not consume a move');
 await fixture('boundary');expected=semantic(read());await click('7 пик, позиция 22',true);assert(read().state.tableau[11].open && read().state.tableau[12].open,'two exposed');await click('↶Отменить');assert(semantic(read())===expected,'boundary undo');pass('D[3] exposes C[2] + C[3]; one undo closes both');
 await fixture('last');doc().querySelector('.t-stock').click();await pause();assert(read().state.status==='playing' && read().state.stock.length===0,'last stock still playing');await click('A пик, позиция 19',true);assert(read().state.status==='won','win');assert(doc().querySelector('h2').textContent.includes('Победа'),'win panel');assert(doc().querySelector('.app-panel').textContent.includes('Лучшая цепочка: 1'),'best chain');await reload();assert(read().state.status==='won','won reload');await click('Отменить последний ход');assert(read().state.status==='playing' && read().state.chain===0 && read().state.best_chain===0,'undo result chain');pass('last stock, victory, result reload and exact chain undo');
 await fixture('stuck');expected=semantic(read());doc().querySelector('.t-stock').click();await pause();assert(read().state.status==='stuck','stuck');assert(doc().querySelector('h2').textContent==='Ходов нет','stuck panel');await click('Отменить последний ход');assert(semantic(read())===expected,'undo stuck');pass('dead end result and undo');
 await fixture('start');const initial=JSON.stringify(read().state);doc().querySelector('.t-stock').click();await pause();await actions();await click('Начать расклад заново');await click('Начать заново');assert(JSON.stringify(read().state)===initial,'repeat');await actions();await click('Поделиться раскладом');const link=doc().querySelector('textarea').value;assert(link.includes('t1_1_000000000000002a'),'share code');await click('Вернуться к игре');const ordinary=raw(slot);await reload('?deal=t1_1_000000000000002a');await click('Играть');assert(JSON.stringify(read().state)===initial,'invitation');assert(raw(slot)===ordinary,'ordinary preserved');pass('repeat / link reproduce all 28 cards, waste and ordered stock');
 await actions();await click('Как играть');assert(doc().querySelector('.app-panel').textContent.includes('Туз'),'help');await click('Вернуться к столу');await click('Пауза',true);await click('Расклад дня · Паук');await click('Играть');assert(read().kind==='spider','daily Spider');pass('daily remains Spider');
 await fixture('start');r.textContent+='ALL PASSED\n';
 }catch(e){r.textContent+='FAIL '+e.stack;}};
document.querySelector('#start').onclick=async()=>{f.style.width='390px';await fixture('start');};document.querySelector('#small').onclick=async()=>{f.style.width='360px';await fixture('start');};
</script>
