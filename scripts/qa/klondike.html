<!doctype html><meta charset="utf-8"><title>Косынка · приёмка 1.2</title>
<style>body{margin:0;min-height:844px;background:#16271e;color:#f4e6bd;font:13px system-ui}aside{position:fixed;left:12px;top:8px;width:240px}button{margin:3px;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.35 monospace}iframe{display:block;border:0;width:390px;height:844px;margin:auto}</style>
<aside><p>Косынка 1.2 · отдельные тестовые данные</p><button id="setup">Старый Паук, без Косынки</button><button data-fixture="tail">Хвост 9–8–7</button><button data-fixture="dual">Два назначения</button><button data-fixture="before-win">Перед победой</button><button data-fixture="redeal-ready">Запас исчерпан</button><br><button id="invite">Приглашение Косынки</button><button id="old">Прежний вызов Паука</button><button id="invalid">Неверный код</button><br><button data-size="390,844">390 × 844</button><button data-size="360,640">360 × 640</button><button data-size="390,500">390 × 500</button><br><button id="capture">Запомнить</button><button id="reload">Перезапуск</button><button id="assess">Проверить</button><pre id="report">Готово</pre></aside><iframe src="/?qa=klondike"></iframe>
<script>
const f=document.querySelector('iframe'),r=document.querySelector('#report'),base='spider.game.v1',k='klondike_regular';let captured=null,expected=false;
const key=s=>s==='regular'?base:base+'.'+s;
const active=()=>localStorage.getItem(base+'.active')||'regular';
const read=s=>{let g=JSON.parse(localStorage.getItem(key(s))||'null');return g?.game||g;};
const snapshot=()=>Object.fromEntries(Object.keys(localStorage).filter(x=>x===base||x.startsWith(base+'.klondike_regular')||x.startsWith(base+'.daily_')||x.startsWith(base+'.challenge_')).filter(x=>!x.includes('.conflict.')).sort().map(x=>{const raw=localStorage.getItem(x);let g=JSON.parse(raw);g=g?.game||g;return[x,JSON.stringify({state:g.state,history:g.history,deal:g.deal??null,seed:raw.match(/"seed":(\d+)/)?.[1]})];}));
const load=async n=>(await fetch('/fixtures/'+n+'.json')).text();
const reload=()=>f.src='/?qa=klondike'+Date.now();
document.querySelector('#setup').onclick=async()=>{localStorage.setItem(base,await load('spider-legacy4'));localStorage.removeItem(key(k));localStorage.setItem(base+'.active','regular');expected=false;captured=snapshot();reload();r.textContent='Обычный Паук 4 масти, 1 ход, 1 отмена; Косынки нет.';};
for(const b of document.querySelectorAll('[data-fixture]'))b.onclick=async()=>{localStorage.setItem(key(k),await load('klondike-'+b.dataset.fixture));localStorage.setItem(base+'.active',k);expected=false;reload();r.textContent='Синтетическая позиция '+b.dataset.fixture;};
document.querySelector('#invite').onclick=()=>{captured=snapshot();expected=true;f.src='/?deal=k1_1_0123456789abcdef';};
document.querySelector('#old').onclick=()=>{captured=snapshot();expected=false;f.src='/?deal=s1_4_0123456789abcdef';};
document.querySelector('#invalid').onclick=()=>{captured=snapshot();expected=false;f.src='/?deal=k9_1_nope';};
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const[w,h]=b.dataset.size.split(',');f.style.width=w+'px';f.style.height=h+'px';document.body.style.minHeight=h+'px';};
document.querySelector('#capture').onclick=()=>{captured=snapshot();r.textContent='Запомнены позиции и история всех слотов';};document.querySelector('#reload').onclick=reload;
document.querySelector('#assess').onclick=async()=>{try{const d=f.contentDocument,g=read(active()),now=snapshot(),panel=d.querySelector('[role=dialog]');const columns=[...d.querySelectorAll('.k-column')],homes=[...d.querySelectorAll('.k-foundation')],row=[...(d.querySelector('.k-piles')?.children||[])];const ring=d.querySelector('.k-column .selection-ring'),eight=d.querySelector('.k-column .card[data-card-id="20"]'),seven=d.querySelector('.k-column .card[data-card-id="32"]');let exact=null;if(ring&&eight&&seven){const a=ring.getBoundingClientRect(),b=eight.getBoundingClientRect(),c=seven.getBoundingClientRect();exact=Math.abs(a.top-b.top)<.1&&Math.abs(a.bottom-c.bottom)<.1;}
let match=null;if(expected&&g.kind==='klondike'){const golden=await(await fetch('/fixtures/klondike-v1.json')).json();const fields=s=>[s.columns,s.stock,s.waste,s.foundations,s.moves,s.status];match=JSON.stringify(fields(g.state))===JSON.stringify(fields(golden['k1_1_0123456789abcdef']));}
const start=panel?[...panel.querySelectorAll('button')].find(x=>x.textContent==='Начать игру'):null;const app=d.querySelector('.game')?.getBoundingClientRect();r.textContent=JSON.stringify({viewport:[f.contentWindow.innerWidth,f.contentWindow.innerHeight],active:active(),kind:g.kind||'legacy_spider',moves:g.state.moves,undo:g.history.length,stock:g.state.stock.length,next:g.state.stock.at(-1)?.id,waste:g.state.waste?.map(c=>c.id),homes:g.state.foundations?.map(c=>c.length),status:g.state.status,columns:g.state.columns.map(c=>c.length),targets:columns.flatMap((c,i)=>c.classList.contains('target')?[i]:[]),homeTargets:homes.flatMap((c,i)=>c.classList.contains('target')?[i]:[]),selectionExact:exact,goldenMatch:match,panels:d.querySelectorAll('[role=dialog]').length,panel:panel?.getAttribute('aria-label'),warning:!!panel?.querySelector('.replacement-warning'),startVisible:!start||start.getBoundingClientRect().bottom<=app.bottom,noHorizontalOverflow:d.documentElement.scrollWidth<=f.contentWindow.innerWidth,gutterAligned:columns.length===7&&row.length===7?columns.every((c,i)=>Math.abs(c.getBoundingClientRect().left-row[i].getBoundingClientRect().left)<=1.1):null,preserved:captured?Object.fromEntries(Object.keys(captured).map(x=>[x.replace(base,'base'),now[x]===captured[x]])):null});}catch(e){r.textContent='ERROR '+e.message;}};
</script>
