worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout safe;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types application/wasm application/javascript text/css image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        resolver 127.0.0.11 valid=10s;
        location /api/ {
            set $api http://api:8082;
            proxy_pass $api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            client_max_body_size 2m;
            add_header Cache-Control "no-store" always;
            access_log off;
        }
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location = / { add_header Cache-Control 'no-cache'; try_files /index.html =404; }
        location = /index.html { add_header Cache-Control 'no-cache'; }
        location = /config.js { add_header Cache-Control 'no-cache'; }
        location = /sharing.js { add_header Cache-Control 'no-cache'; }
        location = /platform.js { add_header Cache-Control 'no-cache'; }
        location ~* \.(wasm|js|css)$ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
        location / { try_files $uri $uri/ =404; }
    }
}
